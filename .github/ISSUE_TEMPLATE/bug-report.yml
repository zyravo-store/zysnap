name: Bug report / 问题报告
description: Report a reproducible problem / 提交可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: browser
    attributes:
      label: Browser / 浏览器
      options: [Chrome, Edge, Firefox, Safari, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: "Version 1.0.0 (260727)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
